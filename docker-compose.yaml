services:
    mongo1:
        image: mongo:7.0
        container_name: mongo
        entrypoint: ['bash', '/scripts/mongo-docker-entrypoint.sh']
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-mongo}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
        command:
            - --replSet
            - rs0
            - --bind_ip_all
            - --port
            - '27017'
            - --auth
            - --keyFile
            - /data/configdb/mongo-keyfile
        ports:
            - '127.0.0.1:27717:27017'
        healthcheck:
            test:
                - CMD-SHELL
                - >
                    echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }" |
                    mongosh --port 27017 -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --quiet
            interval: 5s
            timeout: 30s
            retries: 30
        volumes:
            - mongo1_data:/data/db
            - mongo1_config:/data/configdb
            - ./secrets/mongo-keyfile:/etc/mongo-keyfile:ro
            - ./scripts/mongo-docker-entrypoint.sh:/scripts/mongo-docker-entrypoint.sh:ro

volumes:
    mongo1_data:
    mongo1_config:
