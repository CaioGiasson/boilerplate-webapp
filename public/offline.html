<!doctype html>
<html lang="pt">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<title>Offline</title>
		<style>
			:root {
				--background: #f8fafc;
				--foreground: #0f172a;
				--accent: #475569;
			}
			html.dark {
				--background: #151519;
				--foreground: #ececf1;
				--accent: #94a3b8;
			}
			html,
			body {
				margin: 0;
				min-height: 100%;
				background: var(--background);
				color: var(--foreground);
				font-family: ui-sans-serif, system-ui, sans-serif;
			}
			.screen {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1.5rem;
				padding: 1.5rem;
			}
			.icon {
				width: 4rem;
				height: 4rem;
				color: var(--accent);
			}
			.message {
				max-width: 28rem;
				margin: 0;
				text-align: center;
				white-space: pre-line;
				font-size: 1.125rem;
				line-height: 1.625;
			}
			.button {
				cursor: pointer;
				border: 1px solid var(--foreground);
				border-radius: 0.375rem;
				background: var(--foreground);
				color: var(--background);
				padding: 0.5rem 1rem;
				font: inherit;
				font-size: 0.875rem;
			}
		</style>
	</head>
	<body>
		<div class="screen" role="alert" data-testid="app-offline-screen">
			<svg
				class="icon"
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="2"
				stroke-linecap="round"
				stroke-linejoin="round"
				aria-hidden="true"
			>
				<path d="m2 2 20 20" />
				<path d="M8.5 16.5a5 5 0 0 1 7 0" />
				<path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
				<path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
				<path d="M16.85 11.25a10 10 0 0 1 2.22 1.68" />
				<path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
				<path d="M12 20h.01" />
			</svg>
			<p class="message" id="app-offline-message">
				Você está sem conexão Verifique sua internet e tente novamente.
			</p>
			<button class="button" type="button" id="app-offline-retry">Tentar novamente</button>
		</div>
		<script src="/theme.js"></script>
		<script>
			;(function () {
				// Textos espelham os catálogos `pwa.offline*` de src/constants/texts (tests/lib/pwa/staticPages.test.ts confere).
				var messages = {
					pt: {
						title: 'Você está sem conexão',
						description: 'Verifique sua internet e tente novamente.',
						retry: 'Tentar novamente',
					},
					en: {
						title: 'You are offline',
						description: 'Check your internet connection and try again.',
						retry: 'Try again',
					},
					es: {
						title: 'Sin conexión',
						description: 'Revisa tu conexión a internet e inténtalo de nuevo.',
						retry: 'Intentar de nuevo',
					},
				}
				function localeFromCookie() {
					try {
						var match = document.cookie.match(/(?:^|; )app-locale=([^;]*)/)
						return match ? decodeURIComponent(match[1]) : ''
					} catch (e) {
						return ''
					}
				}
				var candidate = localeFromCookie()
				var locale = messages[candidate] ? candidate : 'pt'
				var copy = messages[locale]
				document.documentElement.lang = locale
				document.getElementById('app-offline-message').textContent = copy.title + '\n\n' + copy.description
				var retry = document.getElementById('app-offline-retry')
				retry.textContent = copy.retry
				retry.addEventListener('click', function () {
					location.reload()
				})
			})()
		</script>
	</body>
</html>
