name: Bug
description: Reportar comportamento incorreto ou regressão
title: '[Bug] '
labels: ['bug']
body:
    - type: markdown
      attributes:
          value: |
              Tarefas do App devem estar no [board do projeto](https://github.com/users/CaioGiasson/projects/4/views/1).
              Refine o pedido antes de abrir — ver [`docs/issue-workflow.md`](../../docs/issue-workflow.md).

    - type: textarea
      id: context
      attributes:
          label: Contexto
          description: O que você estava fazendo? Ambiente (dev/prod)?
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: Comportamento esperado
      validations:
          required: true

    - type: textarea
      id: actual
      attributes:
          label: Comportamento atual
      validations:
          required: true

    - type: textarea
      id: reproduction
      attributes:
          label: Passos para reproduzir
          placeholder: |
              1. …
              2. …
      validations:
          required: true

    - type: textarea
      id: acceptance
      attributes:
          label: Critérios de aceite
          description: Como saber que está corrigido?
      validations:
          required: true

    - type: textarea
      id: notes
      attributes:
          label: Restrições / notas
          description: Segurança, i18n, camadas, etc.
