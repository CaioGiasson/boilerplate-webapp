                  in: query
                  schema: { type: string, format: date-time }
                - name: createdTo
                  in: query
                  schema: { type: string, format: date-time }
                - name: cursor
                  in: query
                  schema: { type: string }
            responses:
                '200':
                    description: Página cursor
                    content:
