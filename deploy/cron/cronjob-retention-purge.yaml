# Exemplo de Kubernetes CronJob para retenção de contas.
# Ajuste image, secrets e schedule ao ambiente real antes de aplicar.
apiVersion: batch/v1
kind: CronJob
metadata:
    name: boilerplate-webapp-retention-purge
    labels:
        app: boilerplate-webapp
        job: retention-purge
spec:
    # Diário às 03:00 UTC — alinhar ao fuso do operador se necessário
    schedule: '0 3 * * *'
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    jobTemplate:
        spec:
            backoffLimit: 1
            template:
                metadata:
                    labels:
                        app: boilerplate-webapp
                        job: retention-purge
                spec:
                    restartPolicy: Never
                    containers:
                        - name: retention-purge
                          image: boilerplate-webapp:latest
                          imagePullPolicy: IfNotPresent
                          workingDir: /app
                          command: ['npm', 'run', 'cron', '--', 'retention-purge', '--confirm']
                          envFrom:
                              - secretRef:
                                    name: boilerplate-webapp-env
