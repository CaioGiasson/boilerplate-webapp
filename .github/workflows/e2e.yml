name: E2E

on:
    pull_request:
    workflow_dispatch:

concurrency:
    group: e2e-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    e2e:
        name: e2e
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # Ainda não validado em um runner: não bloqueia o merge até a primeira execução verde.
        # Depois disso, remova esta linha e inclua `E2E / e2e` nos checks exigidos (docs/operators/e2e.md).
        continue-on-error: true

        services:
            mongo:
                image: mongo:7.0
                ports:
                    - 27017:27017
                options: >-
                    --health-cmd "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"127.0.0.1:27017\"}]}).ok }'"
                    --health-interval 5s
                    --health-timeout 10s
                    --health-retries 20
                # Prisma usa transações: o Mongo precisa ser replica set.
                command: mongod --replSet rs0 --bind_ip_all

        env:
            DATABASE_URL: mongodb://127.0.0.1:27017/e2e?replicaSet=rs0&directConnection=true
            JWT_SECRET: ci-jwt-secret-minimum-32-characters-long
            CACHE_LIFETIME_SECONDS: '3600'
            SPACES_ENDPOINT: nyc3.digitaloceanspaces.com
            SPACES_BUCKET: app-ci
            SPACES_ACCESS_KEY_ID: ci-access-key
            SPACES_SECRET_ACCESS_KEY: ci-secret-key
            ENVIRONMENT: dev

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22.19.0'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Prisma generate + schema no banco E2E
              run: |
                  npm run prisma:generate
                  npm run e2e:prepare

            - name: Build
              run: npm run build
              env:
                  EMAIL_PROVIDER: none
                  AI_PROVIDER: none

            - name: Install Chromium
              run: npx playwright install --with-deps chromium

            - name: Run E2E
              run: npm run e2e

            - name: Upload report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7
