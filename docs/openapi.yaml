openapi: 3.0.3
info:
    title: App API
    version: 1.0.0
    description: |
        Contrato HTTP do App (Next.js App Router).

        **Auth:** cookie de sessão JWT (`app-session` / `__Host-app-session`).
        Rotas mutáveis de auth exigem same-origin (`Origin` alinhado ao host).

        **Envelope v1 (sucesso):** `{ "success": true, "message": "...", "data": { ... } }`
        **Envelope v1 (erro):** `{ "success": false, "message": "...", "code": "..." }`

        Spec canônica no repo: `docs/openapi.yaml`. UI interativa: `GET /api/docs` (gated).
        Smoke manual: `requests/**/*.http`.
    contact:
        name: App
servers:
    - url: http://localhost:3000
      description: Dev local
tags:
    - name: health
    - name: docs
    - name: auth
    - name: users
    - name: admin
    - name: system
    - name: notifications
    - name: push
    - name: nickname
    - name: images
    - name: examples

paths:
    /api/health:
        get:
            tags: [health]
            summary: Liveness / readiness leve
            security:
                - HealthToken: []
                - {}
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success: { type: boolean, example: true }
                                    status: { type: string, example: ok }
                                    dependencies:
                                        type: object
                                        properties:
                                            database:
                                                type: object
                                                properties:
                                                    url: { type: string, example: /api/health/database }
                '404':
                    description: Acesso negado (não loopback e sem token)

    /api/health/database:
        get:
            tags: [health]
            summary: Ping MongoDB via Prisma
            security:
                - HealthToken: []
                - {}
            responses:
                '200':
                    description: DB up
                '404':
                    description: Acesso negado
                '503':
                    description: DB down

    /api/docs:
        get:
            tags: [docs]
            summary: Swagger UI (somente se SWAGGER_ENABLED)
            security:
                - SwaggerBasic: []
            responses:
                '200':
                    description: HTML Swagger UI
                '401':
                    description: Credenciais ausentes/inválidas
                '404':
                    description: Desabilitado ou mal configurado

    /api/docs/openapi:
        get:
            tags: [docs]
            summary: Spec OpenAPI (YAML)
            security:
                - SwaggerBasic: []
            responses:
                '200':
                    description: openapi.yaml
                    content:
                        application/yaml:
                            schema:
                                type: string
                '401':
                    description: Credenciais ausentes/inválidas
                '404':
                    description: Desabilitado ou mal configurado

    /api/v1/auth/register:
        post:
            tags: [auth]
            summary: Registrar usuário e abrir sessão
            security: []
            parameters:
                - $ref: '#/components/parameters/OriginHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegisterBody'
            responses:
                '201':
                    description: Criado + Set-Cookie de sessão
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessUser'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '403':
                    description: CSRF / origin
                '409':
                    description: Nickname ou e-mail em uso
                '429':
                    $ref: '#/components/responses/RateLimited'

    /api/v1/auth/login:
        post:
            tags: [auth]
            summary: Login
            security: []
            parameters:
                - $ref: '#/components/parameters/OriginHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [identifier, password]
                            properties:
                                identifier: { type: string, description: E-mail ou nickname }
                                password: { type: string, maxLength: 128 }
            responses:
                '200':
                    description: OK + cookies
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiSuccess'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  user: { $ref: '#/components/schemas/PublicUser' }
                                                  settings: { type: object }
                                                  twoFactorRequired:
                                                      type: boolean
                                                      description: |
                                                          `true` quando a senha está certa e a conta tem 2FA. Nesse caso **não** há cookie de sessão
                                                          nem `user`: envie o código a `POST /auth/2fa/verify` com o `challengeToken`.
                                                  challengeToken:
                                                      type: string
                                                      description: Vale 5 minutos e só serve para `/auth/2fa/verify`.
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '429':
                    $ref: '#/components/responses/RateLimited'

    /api/v1/auth/2fa/verify:
        post:
            tags: [auth]
            summary: Segundo passo do login (2FA)
            description: |
                Confere o código TOTP **ou** um código de recuperação e abre a sessão (mesma resposta e cookies do login).
                Mande exatamente um dos dois. Limite de 5 tentativas por minuto por IP, com bloqueio progressivo.
                O mesmo código TOTP não vale duas vezes e cada código de recuperação vale uma. Sem a chave de cifra no
                servidor responde 503 (falha fechada).
            security: []
            parameters:
                - $ref: '#/components/parameters/OriginHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [challengeToken]
                            properties:
                                challengeToken: { type: string }
                                code: { type: string, example: '123456', description: 6 dígitos do app autenticador }
                                recoveryCode: { type: string, example: ABCDE-FGHIJ }
            responses:
                '200':
                    description: OK + cookies (mesmo corpo do login)
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '503':
                    description: 2FA indisponível (servidor sem TWO_FACTOR_ENCRYPTION_KEY)

    /api/v1/auth/logout:
        post:
            tags: [auth]
            summary: Logout (limpa cookies)
            parameters:
                - $ref: '#/components/parameters/OriginHeader'
            responses:
                '204':
                    description: Sem corpo

    /api/v1/auth/me:
        get:
            tags: [auth]
            summary: Sessão atual
            description: |
                Além do usuário, devolve `impersonation` — `{ expiresAt }` quando a sessão é de impersonamento
                (admin atuando como o usuário) ou `null` na sessão comum.
            security:
                - SessionCookie: []
            responses:
                '200':
                    description: Sessão ativa
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessUser'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  impersonation:
                                                      type: object
                                                      nullable: true
                                                      properties:
                                                          expiresAt: { type: string, format: date-time }
                '401':
                    $ref: '#/components/responses/Unauthorized'

    /api/v1/notifications:
        get:
            tags: [notifications]
            summary: Listar as notificações do usuário (mais recentes primeiro)
            security:
                - SessionCookie: []
            parameters:
                - name: cursor
                  in: query
                  required: false
                  description: Cursor opaco da página anterior (`nextCursor`); 400 se inválido
                  schema: { type: string }
                - name: limit
                  in: query
                  required: false
                  schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
            responses:
                '200':
                    description: Página de notificações
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiSuccess'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  items:
                                                      type: array
                                                      items:
                                                          type: object
                                                          properties:
                                                              id: { type: string }
                                                              type: { type: string }
                                                              title: { type: string }
                                                              text: { type: string }
                                                              link:
                                                                  {
                                                                      type: string,
                                                                      nullable: true,
                                                                      description: Caminho interno,
                                                                  }
                                                              read: { type: boolean }
                                                              createdAt: { type: string, format: date-time }
                                                  unreadCount: { type: integer }
                                                  nextCursor: { type: string, nullable: true }
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'

    /api/v1/notifications/read-all:
        post:
            tags: [notifications]
            summary: Marcar todas as notificações como lidas
            security:
                - SessionCookie: []
            parameters:
                - $ref: '#/components/parameters/OriginHeader'
            responses:
                '200':
                    description: Quantas foram marcadas
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiSuccess'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  updatedCount: { type: integer }
                '401':
                    $ref: '#/components/responses/Unauthorized'

    /api/v1/notifications/{id}/read:
        post:
            tags: [notifications]
            summary: Marcar uma notificação como lida
            description: Notificação inexistente ou de outro usuário responde 404 igual.
            security:
                - SessionCookie: []
            parameters:
                - $ref: '#/components/parameters/OriginHeader'
                - $ref: '#/components/parameters/UserId'
            responses:
                '200':
                    description: Marcada (idempotente)
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    description: Notificação não encontrada

    /api/v1/push/vapid-public-key:
        get:
            tags: [push]
            summary: Configuração pública do Web Push
            description: 'Público. `enabled: false` e `publicKey: null` quando o servidor não tem `VAPID_*`.'
            responses:
                '200':
                    description: Configuração
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiSuccess'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  enabled: { type: boolean }
                                                  publicKey: { type: string, nullable: true }

    /api/v1/push/subscriptions:
        post:
            tags: [push]
            summary: Registrar o aparelho para receber push
            description: |
                Formato de `PushSubscription.toJSON()`. Exige HTTPS público no `endpoint`; máximo de 10 aparelhos por usuário (409).
                Recusado (403) durante impersonamento e (503) sem `VAPID_*`. Rate limit de autenticação.
            security:
                - SessionCookie: []
            parameters:
                - $ref: '#/components/parameters/OriginHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [endpoint, keys]
                            properties:
                                endpoint: { type: string }
                                keys:
                                    type: object
                                    required: [p256dh, auth]
                                    properties:
                                        p256dh: { type: string }
                                        auth: { type: string }
            responses:
                '200':
                    description: Assinatura salva (substitui a de outra conta no mesmo aparelho)
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    description: Sessão de impersonamento
                '409':
                    description: Limite de aparelhos
                '429':
                    $ref: '#/components/responses/RateLimited'
                '503':
                    description: Push não configurado
        delete:
            tags: [push]
            summary: Cancelar a assinatura do aparelho
            description: Idempotente; só remove assinatura do próprio usuário.
            security:
                - SessionCookie: []
            parameters:
                - $ref: '#/components/parameters/OriginHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [endpoint]
                            properties:
                                endpoint: { type: string }
            responses:
                '200':
                    description: Resultado (`removed`)
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    description: Sessão de impersonamento

    /api/v1/push/test:
        post:
            tags: [push]
            summary: Enviar uma notificação de teste para a própria conta
            security:
                - SessionCookie: []
            parameters:
                - $ref: '#/components/parameters/OriginHeader'
            responses:
                '200':
                    description: Notificação criada e push enviado
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    description: Sessão de impersonamento
                '429':
                    $ref: '#/components/responses/RateLimited'
                '503':
                    description: Push não configurado

    /api/ping:
        get:
            tags: [system]
            summary: Sonda de conectividade do navegador
            description: |
                Público, sem estado, sem acesso ao banco e sem cache (`Cache-Control: no-store`). Serve de sonda para o cliente
                saber se há rede. Diferente de `/api/health*`, que só responde a loopback ou token. `HEAD` devolve 200 sem corpo.
            responses:
                '200':
                    description: Servidor alcançável
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiSuccess'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  ok: { type: boolean, example: true }

    /api/v1/version:
        get:
            tags: [system]
            summary: Versão do app em execução
            description: |
                Público, sem estado e sem cache (`Cache-Control: no-store`). O cliente compara com a versão do próprio
                bundle (`package.json`) a cada 5 min e ao voltar para a aba; se diferir, recarrega o app (PWA).
            responses:
                '200':
                    description: Versão atual
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiSuccess'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  version: { type: string, example: 0.1.0 }

    /api/v1/auth/impersonate:
        post:
            tags: [auth]
            summary: Iniciar sessão de impersonamento a partir do token emitido por um admin
            description: |
                Troca o token de `POST /api/v1/admin/users/{id}/impersonation-token` por um cookie de sessão
                de **10 minutos, sem renovação**. Durante essa sessão respondem **403**: troca de senha, troca e verificação de e-mail, exclusão de conta e decisão de quarentena, exportação de dados, revogação de sessões, assinatura/cancelamento/teste de push e as rotas `admin/*`. Só funciona em navegador **sem sessão válida** (409 caso contrário).
                A sessão não aparece em Dispositivos do alvo e não dispara aviso de novo login. Qualquer falha do token
                responde 401 sem revelar o motivo. Rate limit de autenticação.
            parameters:
                - $ref: '#/components/parameters/OriginHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [token]
                            properties:
                                token: { type: string }
            responses:
                '200':
                    description: Sessão iniciada (cookie definido)
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiSuccess'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  expiresAt: { type: string, format: date-time }
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '409':
                    description: O navegador já tem uma sessão ativa
                '429':
                    $ref: '#/components/responses/RateLimited'

    /api/v1/users/me/2fa:
        get:
            tags: [users]
            summary: Estado do 2FA da conta
            description: |
                `available` é `false` quando o servidor não tem `TWO_FACTOR_ENCRYPTION_KEY` (a tela esconde o 2FA).
            security:
                - SessionCookie: []
            responses:
                '200':
                    description: Estado
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiSuccess'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  available: { type: boolean }
                                                  enabled: { type: boolean }
                                                  recoveryCodesRemaining: { type: integer }
                '401':
                    $ref: '#/components/responses/Unauthorized'

    /api/v1/users/me/2fa/setup:
        post:
            tags: [users]
            summary: Inicia a ativação do 2FA
            description: |
                Gera o segredo (guardado cifrado como **pendente**) e devolve `secret` (base32) e `otpauthUri`. O 2FA só
                vale depois de `/2fa/enable`. Exige conta com senha. 409 se já está ativo; 503 sem a chave de cifra.
            security:
                - SessionCookie: []
            responses:
                '200':
                    description: Segredo para o app autenticador
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiSuccess'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  secret: { type: string, example: JBSWY3DPEHPK3PXP }
                                                  otpauthUri: { type: string }
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    description: Sessão de impersonamento
                '409':
                    description: 2FA já ativo
                '503':
                    description: 2FA indisponível (servidor sem TWO_FACTOR_ENCRYPTION_KEY)

    /api/v1/users/me/2fa/enable:
        post:
            tags: [users]
            summary: Confirma o app e ativa o 2FA
            description: Confere o código com o segredo pendente, ativa e devolve os códigos de recuperação **uma única vez**.
            security:
                - SessionCookie: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [code]
                            properties:
                                code: { type: string, example: '123456' }
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiSuccess'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  recoveryCodes:
                                                      type: array
                                                      items: { type: string, example: ABCDE-FGHIJ }
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    description: Sessão de impersonamento
                '429':
                    $ref: '#/components/responses/RateLimited'

    /api/v1/users/me/2fa/disable:
        post:
            tags: [users]
            summary: Desativa o 2FA
            description: Exige a senha **e** um código do app ou de recuperação (um dos dois). Apaga o segredo e os códigos de recuperação.
            security:
                - SessionCookie: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [password]
                            properties:
                                password: { type: string, maxLength: 128 }
                                code: { type: string, example: '123456' }
                                recoveryCode: { type: string, example: ABCDE-FGHIJ }
            responses:
                '200':
                    description: OK
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    description: Sessão de impersonamento
                '429':
                    $ref: '#/components/responses/RateLimited'

    /api/v1/users/me/2fa/recovery-codes:
        post:
            tags: [users]
            summary: Gera novos códigos de recuperação
            description: Exige o código do app (um código de recuperação não serve). Os códigos anteriores deixam de valer; os novos aparecem **uma única vez**.
            security:
                - SessionCookie: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [code]
                            properties:
                                code: { type: string, example: '123456' }
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiSuccess'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  recoveryCodes:
                                                      type: array
                                                      items: { type: string, example: ABCDE-FGHIJ }
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    description: Sessão de impersonamento
                '429':
                    $ref: '#/components/responses/RateLimited'

    /api/v1/admin/audit-events:
        get:
            tags: [admin]
            summary: Listar a trilha de auditoria (somente ADMIN)
            description: |
                Paginação por cursor, mais recentes primeiro (20 por página, máx. 100). Somente leitura. O IP, o `requestId`
                e o `metadata` dos eventos ficam no banco e **não** saem por aqui. Recusado (403) durante impersonamento.
            security:
                - SessionCookie: []
            parameters:
                - name: cursor
                  in: query
                  required: false
                  description: 'Valor de `pageInfo.nextCursor` da página anterior (opaco).'
                  schema: { type: string, maxLength: 200 }
                - name: limit
                  in: query
                  required: false
                  schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
                - name: order
                  in: query
                  required: false
                  schema: { type: string, enum: [asc, desc], default: desc }
                - name: action
                  in: query
                  required: false
                  schema:
                      type: string
                      enum:
                          - admin.impersonation_token_created
                          - auth.impersonation_started
                          - user.password_changed
                          - user.password_reset
                          - user.email_changed
                          - user.sessions_revoked_others
                          - user.account_deletion_requested
                          - user.account_deletion_cancelled
                          - user.account_deletion_kept
                          - user.two_factor_enabled
                          - user.two_factor_disabled
                          - user.two_factor_recovery_regenerated
                          - user.two_factor_recovery_used
                          - operator.role_changed
                          - operator.two_factor_reset
                          - operator.password_changed
                          - operator.feature_flag_toggled
            responses:
                '200':
                    description: Página de eventos
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiSuccess'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  items:
                                                      type: array
                                                      items:
                                                          type: object
                                                          properties:
                                                              id: { type: string }
                                                              action: { type: string, example: user.password_changed }
                                                              actorType:
                                                                  {
                                                                      type: string,
                                                                      enum: [user, admin, operator, system],
                                                                  }
                                                              actor:
                                                                  type: object
                                                                  nullable: true
                                                                  properties:
                                                                      id: { type: string }
                                                                      nickname: { type: string, nullable: true }
                                                              target:
                                                                  type: object
                                                                  nullable: true
                                                                  properties:
                                                                      id: { type: string }
                                                                      nickname: { type: string, nullable: true }
                                                              createdAt: { type: string, format: date-time }
                                                  pageInfo:
                                                      type: object
                                                      properties:
                                                          nextCursor: { type: string, nullable: true }
                                                          hasNext: { type: boolean }
                                                          limit: { type: integer }
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    description: Sem papel ADMIN ou sessão de impersonamento

    /api/v1/admin/users:
        get:
            tags: [admin]
            summary: Listar usuários ativos (somente ADMIN)
            description: |
                Paginação por cursor: mais recentes primeiro por padrão, 20 por página (máx. 100). E-mail sempre mascarado.
                A busca `q` casa por trecho do **apelido** (sem diferenciar maiúsculas); e-mail não é pesquisável.
                Recusado (403) durante impersonamento.
            security:
                - SessionCookie: []
            parameters:
                - name: cursor
                  in: query
                  required: false
                  description: 'Valor de `pageInfo.nextCursor` da página anterior (opaco).'
                  schema: { type: string, maxLength: 200 }
                - name: limit
                  in: query
                  required: false
                  schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
                - name: q
                  in: query
                  required: false
                  schema: { type: string, maxLength: 100 }
                - name: order
                  in: query
                  required: false
                  description: Ordem por data de criação.
                  schema: { type: string, enum: [asc, desc], default: desc }
            responses:
                '200':
                    description: Página de usuários
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiSuccess'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  items:
                                                      type: array
                                                      items:
                                                          type: object
                                                          properties:
                                                              id: { type: string }
                                                              nickname: { type: string }
                                                              emailMasked: { type: string, example: 'a***@e***.com' }
                                                              role: { type: string, enum: [USER, ADMIN] }
                                                              emailVerified: { type: boolean }
                                                              createdAt: { type: string, format: date-time }
                                                  pageInfo:
                                                      type: object
                                                      properties:
                                                          nextCursor: { type: string, nullable: true }
                                                          hasNext: { type: boolean }
                                                          limit: { type: integer }
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    description: Sem papel ADMIN ou sessão de impersonamento

    /api/v1/admin/users/{id}/impersonation-token:
        post:
            tags: [admin]
            summary: Emitir token de impersonamento de um usuário (somente ADMIN)
            description: |
                Token válido por 10 minutos, entregue por link `/?impersonate=<token>` e consumido por
                `POST /api/v1/auth/impersonate`. Recusa o próprio admin e outros admins. O token é o próprio JWT
                de sessão: quem tem o link vira o alvo até expirar; não há revogação antes disso além do logout,
                da troca de senha do alvo ou do emissor deixar de ser ADMIN.
            security:
                - SessionCookie: []
            parameters:
                - $ref: '#/components/parameters/OriginHeader'
                - $ref: '#/components/parameters/UserId'
            responses:
                '200':
                    description: Token emitido
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiSuccess'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  token: { type: string }
                                                  expiresAt: { type: string, format: date-time }
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    description: Sem papel ADMIN, sessão de impersonamento ou alvo é admin
                '404':
                    description: Usuário não encontrado

    /api/v1/auth/password/forgot:
        post:
            tags: [auth]
            summary: Solicitar reset de senha (resposta opaca)
            parameters:
                - $ref: '#/components/parameters/OriginHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [email]
                            properties:
                                email: { type: string, format: email }
                                locale: { $ref: '#/components/schemas/Locale' }
            responses:
                '200':
                    description: Sempre sucesso opaco
                '429':
                    $ref: '#/components/responses/RateLimited'

    /api/v1/auth/password/reset:
        post:
            tags: [auth]
            summary: Redefinir senha com token ou código
            parameters:
                - $ref: '#/components/parameters/OriginHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [newPassword, newPasswordConfirmation]
                            properties:
                                token: { type: string }
                                code: { type: string, minLength: 8, maxLength: 8 }
                                newPassword: { type: string, maxLength: 128 }
                                newPasswordConfirmation: { type: string, maxLength: 128 }
            responses:
                '200':
                    description: Senha alterada
                '404':
                    description: Token/código inválido
                '429':
                    $ref: '#/components/responses/RateLimited'

    /api/v1/auth/email/verify/send:
        post:
            tags: [auth]
            summary: Enviar verificação de e-mail
            security:
                - SessionCookie: []
            parameters:
                - $ref: '#/components/parameters/OriginHeader'
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                locale: { $ref: '#/components/schemas/Locale' }
            responses:
                '200':
                    description: Enviado ou already verified
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '429':
                    $ref: '#/components/responses/RateLimited'

    /api/v1/auth/email/confirm:
        post:
            tags: [auth]
            summary: Confirmar desafio de e-mail
            parameters:
                - $ref: '#/components/parameters/OriginHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [token]
                            properties:
                                token: { type: string, minLength: 8, maxLength: 8 }
                                locale: { $ref: '#/components/schemas/Locale' }
            responses:
                '200':
                    description: E-mail confirmado / challenge resolvido
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessUser'
                '404':
                    description: Token inválido
                '429':
                    $ref: '#/components/responses/RateLimited'

    /api/v1/auth/google/ready:
        get:
            tags: [auth]
            summary: Readiness do login Google (sem secrets)
            security: []
            responses:
                '200':
                    description: Indica se o botão Continuar com Google deve aparecer
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [success, message, data]
                                properties:
                                    success: { type: boolean }
                                    message: { type: string }
                                    data:
                                        type: object
                                        required: [ready]
                                        properties:
                                            ready: { type: boolean }

    /api/v1/auth/google/start:
        get:
            tags: [auth]
            summary: Inicia OAuth Google (redirect 302)
            security: []
            parameters:
                - name: returnUrl
                  in: query
                  required: false
                  schema: { type: string, description: Path relativo same-origin (ex. /images) }
            responses:
                '302':
                    description: Redirect para accounts.google.com (+ cookie de state)
                '429':
                    $ref: '#/components/responses/RateLimited'
                '503':
                    description: Google OAuth não configurado

    /api/v1/auth/google/callback:
        get:
            tags: [auth]
            summary: Callback OAuth Google (redirect 302)
            security: []
            parameters:
                - name: code
                  in: query
                  required: true
                  schema: { type: string }
                - name: state
                  in: query
                  required: true
                  schema: { type: string }
            responses:
                '302':
                    description: Sessão (cookie) ou pending register/link + redirect UI
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '429':
                    $ref: '#/components/responses/RateLimited'

    /api/v1/auth/google/complete-registration:
        post:
            tags: [auth]
            summary: Completa cadastro Google (termos + idade)
            security: []
            parameters:
                - $ref: '#/components/parameters/OriginHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [birthDate, acceptedTerms, acceptedPrivacy]
                            properties:
                                birthDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
                                acceptedTerms: { type: boolean, enum: [true] }
                                acceptedPrivacy: { type: boolean, enum: [true] }
            responses:
                '201':
                    description: Conta criada + sessão
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiSuccess'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  user: { $ref: '#/components/schemas/PublicUser' }
                                                  returnUrl: { type: string }
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '429':
                    $ref: '#/components/responses/RateLimited'

    /api/v1/auth/google/link:
        post:
            tags: [auth]
            summary: Vincula Google a conta existente (exige senha App)
            security: []
            parameters:
                - $ref: '#/components/parameters/OriginHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [password]
                            properties:
                                password: { type: string, maxLength: 128 }
            responses:
                '200':
                    description: Vinculado + sessão
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiSuccess'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  user: { $ref: '#/components/schemas/PublicUser' }
                                                  returnUrl: { type: string }
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '429':
                    $ref: '#/components/responses/RateLimited'

    /api/v1/users/{id}:
        parameters:
            - $ref: '#/components/parameters/UserId'
        get:
            tags: [users]
            summary: Perfil (somente self)
            security:
                - SessionCookie: []
            responses:
                '200':
                    description: Perfil
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessUser'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    description: Não é o próprio usuário
        patch:
            tags: [users]
            summary: Atualizar perfil (somente self)
            security:
                - SessionCookie: []
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name: { type: string, nullable: true }
                                nickname: { type: string }
                                photoUrl:
                                    type: string
                                    nullable: true
                                    description: Somente null para limpar foto
            responses:
                '200':
                    description: Atualizado
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessUser'
                '409':
                    description: Nickname em uso

    /api/v1/users/{id}/password:
        parameters:
            - $ref: '#/components/parameters/UserId'
        patch:
            tags: [users]
            summary: Trocar senha
            security:
                - SessionCookie: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [newPassword, newPasswordConfirmation]
                            properties:
                                currentPassword:
                                    type: string
                                    maxLength: 128
                                    description: Obrigatório se a conta já tem senha; vazio permitido só para conta Google sem senha
                                newPassword: { type: string, maxLength: 128 }
                                newPasswordConfirmation: { type: string, maxLength: 128 }
            responses:
                '200':
                    description: OK (+ cookie de sessão renovado)
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '429':
                    $ref: '#/components/responses/RateLimited'

    /api/v1/users/{id}/photo:
        parameters:
            - $ref: '#/components/parameters/UserId'
        patch:
            tags: [users]
            summary: Upload de foto de perfil (data URL, ≤3MB)
            security:
                - SessionCookie: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [image]
                            properties:
                                image:
                                    type: string
                                    description: data:image/...;base64,...
            responses:
                '200':
                    description: Foto atualizada
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessUser'

    /api/v1/users/{id}/settings:
        parameters:
            - $ref: '#/components/parameters/UserId'
        patch:
            tags: [users]
            summary: Atualizar uma setting
            security:
                - SessionCookie: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SettingPatch'
            responses:
                '200':
                    description: Setting atualizada
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiSuccess'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  user: { $ref: '#/components/schemas/PublicUser' }
                                                  settings: { type: object }

    /api/v1/users/me:
        delete:
            tags: [users]
            summary: Solicitar exclusão de conta (quarentena 30 dias)
            description: |
                Marca `deletedAt`, revoga sessões e envia e-mail de quarentena.
                Não anonimiza nem apaga Spaces. Conta com senha exige `currentPassword`;
                conta só-Google autenticada pode omitir a senha.
            security:
                - SessionCookie: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                currentPassword: { type: string, maxLength: 128 }
                                locale: { type: string, enum: [pt, en, es] }
            responses:
                '200':
                    description: Conta em quarentena; cookies limpos
                '429':
                    $ref: '#/components/responses/RateLimited'

    /api/v1/users/me/deletion:
        get:
            tags: [users]
            summary: Status da quarentena de exclusão (sessão de decisão)
            security:
                - SessionCookie: []
            responses:
                '200':
                    description: deletedAt e deadlineAt
                '401':
                    description: Sem sessão de decisão válida

    /api/v1/users/me/deletion/cancel:
        post:
            tags: [users]
            summary: CANCELAR exclusão do perfil (restaurar conta)
            description: Limpa `deletedAt` e envia e-mail de confirmação do cancelamento (best-effort).
            security:
                - SessionCookie: []
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                locale: { type: string, enum: [pt, en, es] }
            responses:
                '200':
                    description: Conta restaurada
                '401':
                    description: Quarentena expirada ou sessão inválida

    /api/v1/users/me/deletion/keep:
        post:
            tags: [users]
            summary: MANTER exclusão do perfil
            security:
                - SessionCookie: []
            responses:
                '200':
                    description: Quarentena mantida; cookies limpos

    /api/v1/users/me/export:
        get:
            tags: [users]
            summary: Exportação LGPD dos dados do usuário
            security:
                - SessionCookie: []
            responses:
                '200':
                    description: Payload de exportação
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiSuccess'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  exportedAt: { type: string, format: date-time }
                                                  user: { $ref: '#/components/schemas/PublicUser' }
                                                  images:
                                                      type: array
                                                      items: { type: object }
                                                  files:
                                                      type: array
                                                      items: { type: object }
                                                  auditEvents:
                                                      type: array
                                                      description: Ações da trilha de auditoria em que o titular agiu ou foi alvo (sem o id da outra parte)
                                                      items:
                                                          type: object
                                                          properties:
                                                              id: { type: string }
                                                              action: { type: string }
                                                              asActor: { type: boolean }
                                                              asTarget: { type: boolean }
                                                              ip: { type: string, nullable: true }
                                                              createdAt: { type: string, format: date-time }
                                                  aiLogs:
                                                      type: array
                                                      description: Chamadas de IA do titular dentro da janela de retenção (prompt, resposta, tokens)
                                                      items:
                                                          type: object
                                                          properties:
                                                              id: { type: string }
                                                              query: { type: string }
                                                              model: { type: string }
                                                              prompt: { type: string }
                                                              response: { type: string }
                                                              tokenCost: { type: integer }
                                                              createdAt: { type: string, format: date-time }

    /api/v1/users/me/stats:
        get:
            tags: [users]
            summary: Estatísticas de armazenamento do usuário autenticado
            description: |
                Retorna a quantidade de imagens ativas (não soft-deleted) e o total de bytes
                publicados do owner (mesma base da quota de upload: `File.status = published`).
            security:
                - SessionCookie: []
            responses:
                '200':
                    description: Estatísticas do usuário
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiSuccess'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              required: [imageCount, usedBytes]
                                              properties:
                                                  imageCount:
                                                      type: integer
                                                      minimum: 0
                                                      description: Quantidade de imagens ativas do owner
                                                      example: 12
                                                  usedBytes:
                                                      type: integer
                                                      minimum: 0
                                                      description: Soma de sizeBytes dos Files published do owner
                                                      example: 5242880
                '401':
                    description: Não autenticado

    /api/v1/users/me/email/change:
        post:
            tags: [users]
            summary: Solicitar troca de e-mail
            security:
                - SessionCookie: []
            parameters:
                - $ref: '#/components/parameters/OriginHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [password, newEmail]
                            properties:
                                password: { type: string, maxLength: 128 }
                                newEmail: { type: string, format: email }
                                locale: { $ref: '#/components/schemas/Locale' }
            responses:
                '200':
                    description: Challenge iniciado (willUnlinkGoogle se a conta estava vinculada ao Google)
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiSuccess'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  user: { $ref: '#/components/schemas/PublicUser' }
                                                  willUnlinkGoogle: { type: boolean }
                '429':
                    $ref: '#/components/responses/RateLimited'

    /api/v1/users/me/sessions:
        get:
            tags: [users]
            summary: Listar sessões ativas
            security:
                - SessionCookie: []
            responses:
                '200':
                    description: Lista de sessões
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiSuccess'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  sessions:
                                                      type: array
                                                      items:
                                                          type: object
                                                          properties:
                                                              id: { type: string }
                                                              device: { type: string }
                                                              createdAt: { type: string, format: date-time }
                                                              exp: { type: integer }
                                                              current: { type: boolean }
        delete:
            tags: [users]
            summary: Revogar outras sessões (mantém a atual)
            security:
                - SessionCookie: []
            responses:
                '200':
                    description: Contagem de sessões revogadas

    /api/v1/users/me/sessions/{sessionId}:
        parameters:
            - name: sessionId
              in: path
              required: true
              schema: { type: string }
        delete:
            tags: [users]
            summary: Revogar uma sessão específica
            security:
                - SessionCookie: []
            responses:
                '200':
                    description: Revogada
                '404':
                    description: Sessão não encontrada

    /api/v1/nickname/{nickname}:
        parameters:
            - name: nickname
              in: path
              required: true
              schema: { type: string }
        get:
            tags: [nickname]
            summary: Verificar nickname (200 = existe, 404 = disponível)
            security:
                - SessionCookie: []
            responses:
                '200':
                    description: Nickname já existe
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiSuccess'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  exists: { type: boolean, example: true }
                '404':
