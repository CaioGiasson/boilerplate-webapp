                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiSuccess'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  images:
                                                      type: array
                                                      items: { type: object }
                                                  mosaic:
                                                      type: array
                                                      items: { $ref: '#/components/schemas/MosaicImage' }
                                                  nextCursor: { type: string, nullable: true }
                '401':
                    description: scope=mine sem sessão
                '429':
                    $ref: '#/components/responses/RateLimited'
        post:
            tags: [images]
            summary: Upload de imagem (data URL ≤3MB)
            security:
                - SessionCookie: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateImageBody'
            responses:
                '201':
                    description: Criada
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessImage'
                '429':
                    $ref: '#/components/responses/RateLimited'

    /api/v1/images/from-url:
        post:
            tags: [images]
            summary: Importar imagem de URL pública HTTP(S)
            security:
                - SessionCookie: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            allOf:
                                - type: object
                                  required: [url]
                                  properties:
                                      url: { type: string, format: uri }
                                - $ref: '#/components/schemas/ImageMetadata'
            responses:
                '201':
                    description: Importada
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessImage'
                '429':
                    $ref: '#/components/responses/RateLimited'

    /api/v1/images/tags:
        get:
            tags: [images]
            summary: Listar tags agregadas
            parameters:
                - name: scope
                  in: query
                  schema:
                      type: string
                      enum: [mine, all]
                      default: mine
            responses:
                '200':
                    description: Tags
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiSuccess'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  tags:
                                                      type: array
                                                      items: { type: string }
                '401':
                    description: scope=mine sem sessão

    /api/v1/images/{id}:
        parameters:
            - $ref: '#/components/parameters/ImageId'
        get:
            tags: [images]
            summary: Detalhe (respeita visibility / viewer)
            responses:
                '200':
                    description: Mosaic item
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiSuccess'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  mosaic: { $ref: '#/components/schemas/MosaicImage' }
                '404':
                    description: Não encontrado ou sem acesso
        patch:
            tags: [images]
            summary: Atualizar metadados (owner)
            security:
                - SessionCookie: []
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ImageMetadata'
            responses:
                '200':
                    description: Atualizada
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessImage'
        delete:
            tags: [images]
            summary: Soft-delete (owner)
            security:
                - SessionCookie: []
            responses:
                '200':
                    description: Removida

    /api/v1/images/{id}/visibility:
        parameters:
            - $ref: '#/components/parameters/ImageId'
        patch:
            tags: [images]
            summary: Alterar visibility (owner)
            security:
                - SessionCookie: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/VisibilityBody'
            responses:
                '200':
                    description: Visibility atualizada
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessImage'

    /api/v1/images/{id}/report:
        parameters:
            - $ref: '#/components/parameters/ImageId'
        post:
            tags: [images]
            summary: Reportar imagem
            security:
                - SessionCookie: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [reason]
                            properties:
                                reason:
                                    type: string
                                    enum: [spam, nudes_nonconsensual, csam, impersonation, other]
                                details: { type: string, maxLength: 1000 }
            responses:
                '201':
                    description: Report criado

    /api/v1/examples:
        get:
            tags: [examples]
            summary: Exemplo (desabilitado em production)
            parameters:
                - name: identifier
                  in: query
                  required: true
                  schema: { type: string }
            responses:
                '200':
                    description: Exemplo
                '404':
                    description: Desabilitado ou não encontrado

components:
    securitySchemes:
        SessionCookie:
            type: apiKey
            in: cookie
            name: app-session
            description: Em produção o cookie pode ser `__Host-app-session`.
        HealthToken:
            type: http
            scheme: bearer
            description: HEALTHCHECK_TOKEN / HEALTH_TOKEN (também via header x-healthcheck-token).
        SwaggerBasic:
            type: http
            scheme: basic
            description: SWAGGER_USER / SWAGGER_PASSWORD quando SWAGGER_ENABLED=true.

    parameters:
        OriginHeader:
            name: Origin
            in: header
            required: false
            schema: { type: string }
            description: Obrigatório em rotas CSRF (same-origin).
        UserId:
            name: id
            in: path
            required: true
            schema: { type: string }
        ImageId:
            name: id
            in: path
            required: true
            schema: { type: string }

    responses:
        ValidationError:
            description: Validação
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ApiError'
        Unauthorized:
            description: Não autenticado
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ApiError'
        RateLimited:
            description: Rate limit
            headers:
                Retry-After:
                    schema: { type: integer }
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ApiError'

    schemas:
        Locale:
            type: string
            enum: [pt, en, es]
        Visibility:
            type: string
            enum: [PUBLIC, PRIVATE, SECRET, PROTECTED]
        ApiSuccess:
            type: object
            properties:
                success: { type: boolean, example: true }
                message: { type: string }
                data: { type: object }
        ApiError:
            type: object
            properties:
                success: { type: boolean, example: false }
                message: { type: string }
                code:
                    type: string
                    example: VALIDATION_ERROR
                requestId:
                    type: string
                    description: |
                        Id da requisição (o mesmo do header `x-request-id` da resposta). Presente nos erros das rotas com
                        tratamento padrão; use-o para achar a linha no log.
                    example: 7f0c2a9e-4b1d-4c55-9e0a-1f3f6f1a2b3c
        PublicUser:
            type: object
            properties:
                id: { type: string }
                name: { type: string, nullable: true }
                nickname: { type: string }
                email: { type: string }
                photoUrl: { type: string, nullable: true }
                photoThumbnailUrl:
                    type: string
                    nullable: true
                    description: Thumbnail WebP de 200 px (URL assinada). Nulo em avatares anteriores ao pipeline de imagem; use photoUrl nesse caso.
                settings: { type: object }
                emailVerifiedAt: { type: string, format: date-time, nullable: true }
                pendingEmail: { type: string, nullable: true }
                emailChallenge:
                    type: string
                    enum: [none, verify, change_old, change_new]
                hasPassword: { type: boolean, description: Conta já definiu senha App }
                googleLinked: { type: boolean, description: Conta vinculada ao Google OAuth }
                role:
                    type: string
                    enum: [USER, ADMIN]
                    description: Papel de acesso (conta sem o campo conta como USER)
        MosaicImage:
            type: object
            description: DTO de mosaico (URL já assinada quando aplicável)
            properties:
                id: { type: string }
                url: { type: string }
                title: { type: string, nullable: true }
                visibility: { $ref: '#/components/schemas/Visibility' }
        SuccessUser:
            allOf:
                - $ref: '#/components/schemas/ApiSuccess'
                - type: object
                  properties:
                      data:
                          type: object
                          properties:
                              user: { $ref: '#/components/schemas/PublicUser' }
        SuccessImage:
            allOf:
                - $ref: '#/components/schemas/ApiSuccess'
                - type: object
                  properties:
                      data:
                          type: object
                          properties:
                              image: { type: object }
                              mosaic: { $ref: '#/components/schemas/MosaicImage' }
        ImageMetadata:
            type: object
            properties:
                title: { type: string, maxLength: 200, nullable: true }
                description: { type: string, maxLength: 5000, nullable: true }
                tags:
                    type: array
                    maxItems: 20
                    items: { type: string, maxLength: 40 }
                visibility: { $ref: '#/components/schemas/Visibility' }
                isPrivate: { type: boolean }
                isSecret: { type: boolean }
        CreateImageBody:
            allOf:
                - type: object
                  required: [image]
                  properties:
                      image:
                          type: string
                          description: data URL
                - $ref: '#/components/schemas/ImageMetadata'
        VisibilityBody:
            type: object
            properties:
                visibility: { $ref: '#/components/schemas/Visibility' }
                isPrivate: { type: boolean }
                isSecret: { type: boolean }
        SettingPatch:
            type: object
            required: [key, value]
            properties:
                key:
                    type: string
                    enum:
                        - darkMode
                        - showSecretImages
                        - appearInGlobalMosaic
                        - language
                        - homeZoomLevel
                        - imagesZoomLevel
                value:
                    description: Boolean, locale ou int 1–12 conforme a key
                    oneOf:
                        - type: boolean
                        - type: string
                        - type: integer
        RegisterBody:
            type: object
            required:
                - nickname
                - email
                - password
                - passwordConfirmation
                - birthDate
                - acceptedTerms
                - acceptedPrivacy
            properties:
                nickname: { type: string }
                email: { type: string, format: email }
                password: { type: string, maxLength: 128 }
                passwordConfirmation: { type: string, maxLength: 128 }
                birthDate: { type: string, format: date, example: '2000-01-15' }
                acceptedTerms: { type: boolean, enum: [true] }
                acceptedPrivacy: { type: boolean, enum: [true] }
                device: { type: string }
                locale: { $ref: '#/components/schemas/Locale' }
                settings:
                    type: array
                    items: { $ref: '#/components/schemas/SettingPatch' }
