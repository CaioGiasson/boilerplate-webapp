name: E2E

on:
    pull_request:
    workflow_dispatch:

concurrency:
    group: e2e-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    e2e:
        name: e2e
        runs-on: ubuntu-latest
        timeout-minutes: 20

        env:
            DATABASE_URL: mongodb://127.0.0.1:27017/ci?replicaSet=rs0&directConnection=true
            # Banco separado do DATABASE_URL (o e2e:prepare recusa o mesmo).
            E2E_DATABASE_URL: mongodb://127.0.0.1:27017/e2e?replicaSet=rs0&directConnection=true
            JWT_SECRET: ci-jwt-secret-minimum-32-characters-long
            CACHE_LIFETIME_SECONDS: '3600'
            SPACES_ENDPOINT: nyc3.digitaloceanspaces.com
            SPACES_BUCKET: app-ci
            SPACES_ACCESS_KEY_ID: ci-access-key
            SPACES_SECRET_ACCESS_KEY: ci-secret-key
            ENVIRONMENT: dev

        steps:
            # Prisma usa transações: o Mongo precisa ser replica set (`services` não aceita comando).
            - name: Start MongoDB (replica set)
              run: |
                  docker run -d --name mongo -p 27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
                  for i in $(seq 1 30); do
                    docker exec mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' && break
                    sleep 2
                  done
                  docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
                  for i in $(seq 1 30); do
                    docker exec mongo mongosh --quiet --eval 'rs.status().myState' | grep -q '^1' && break
                    sleep 2
                  done

            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22.19.0'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Prisma generate + schema no banco E2E
              run: |
                  npm run prisma:generate
                  npm run e2e:prepare

            - name: Build
              run: npm run build
              env:
                  EMAIL_PROVIDER: none
                  AI_PROVIDER: none

            - name: Install Chromium
              run: npx playwright install --with-deps chromium

            - name: Run E2E
              run: npm run e2e

            - name: Upload report
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7
